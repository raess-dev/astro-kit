# The intake workflow of the private feedback repository (raess-dev/astro-kit-feedback), as .github/workflows/intake.yml.
# A kit site files each KIT-FEEDBACK.md entry as an issue. With KIT_FEEDBACK_AUTO_KEY the body ends in
# "signature: <hex>", an HMAC-SHA256 over the text above it. This workflow re-checks it on every open and edit
# and keeps the label `auto` only on issues whose current body is signed. The body is data: it reaches the
# script through env, never through an expression in the script.
name: intake
on:
  issues:
    types: [opened, edited]
permissions: {}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Verify the signature
        id: verify
        env:
          BODY: ${{ github.event.issue.body }}
          KEY: ${{ secrets.KIT_FEEDBACK_AUTO_KEY }}
        shell: node {0}
        run: |
          const { createHmac, timingSafeEqual } = require('node:crypto');
          const body = (process.env.BODY ?? '').replace(/\r\n/g, '\n').trim();
          const match = /\n+signature: ([0-9a-f]{64})$/.exec(body);
          let valid = false;
          if (match && process.env.KEY) {
            const text = body.slice(0, match.index).trim().normalize('NFC');
            const mac = createHmac('sha256', process.env.KEY).update(text).digest();
            valid = timingSafeEqual(mac, Buffer.from(match[1], 'hex'));
          }
          require('node:fs').appendFileSync(process.env.GITHUB_OUTPUT, `valid=${valid}\n`);
          console.log(valid ? 'signed' : 'not signed');
      - name: Set or remove the label auto
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
          VALID: ${{ steps.verify.outputs.valid }}
        run: |
          gh label create auto --repo "$REPO" --color 0e8a16 --description 'Signed by a kit site' 2>/dev/null || true
          if [ "$VALID" = true ]; then
            gh issue edit "$NUMBER" --repo "$REPO" --add-label auto
          else
            gh issue edit "$NUMBER" --repo "$REPO" --remove-label auto 2>/dev/null || true
          fi
