# Managed by @raess/astro-kit. Kit majors reach the site through the kit's upgrade recipe, not here.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      exclude: ["@raess/astro-kit"]
    groups:
      kit:
        patterns: ["@raess/astro-kit"]
      astro:
        patterns: ["astro", "@astrojs/*"]
      other:
        patterns: ["*"]
    ignore:
      - dependency-name: "@raess/astro-kit"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
