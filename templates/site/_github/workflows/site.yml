# Managed by @raess/astro-kit. A protected path: agents never edit it; `astro-kit init --force` rewrites it.
# ci tests a pull request, merge squashes it when ci passes, build and deploy ship main, preview uploads drafts
# behind Cloudflare Access, smoke checks production, feedback files KIT-FEEDBACK.md entries when a key is set.
name: site
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  push:
    branches: [main]
  workflow_dispatch: # the merge job starts the deploy this way: a merge by the workflow token starts no push run
  schedule:
    - cron: "23 4 * * *" # smoke, daily
    - cron: "47 3 * * 1" # smoke --probe, Mondays
permissions: {}
concurrency:
  group: site-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  ASTRO_TELEMETRY_DISABLED: "1"
  WRANGLER: wrangler@{{WRANGLER}}
jobs:
  ci:
    name: site / ci # the required check of the branch ruleset
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0 # the base branch, for the kit identity and redirect checks
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
      - run: bash .github/kit-identity.sh
        env:
          BASE_REF: ${{ github.base_ref }}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx --no playwright-core install --with-deps chromium
      - run: npx --no astro-kit ci # check, build, test --all, then the base-branch and live-sitemap route checks
      - name: Build the drafts for the preview
        if: github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'preview')
        run: npx --no astro-kit build
        env:
          KIT_DRAFTS: "1"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'preview')
        with:
          name: drafts-dist
          path: dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  merge:
    needs: ci
    if: >-
      github.event_name == 'pull_request' && !github.event.pull_request.draft &&
      (github.event.pull_request.head.repo.full_name == github.repository || github.event.pull_request.user.login == 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Merge the tested head, then start the deploy
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          TESTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          live=$(gh pr view "$PR" --repo "$REPO" --json state,isDraft,headRefOid,baseRefName --jq '[.state, .isDraft, .headRefOid, .baseRefName] | @tsv')
          IFS=$'\t' read -r state draft head base <<<"$live"
          [ "$state" = OPEN ] || { echo "the pull request is $state"; exit 0; }
          [ "$draft" = false ] || { echo 'a draft waits for the owner'; exit 0; }
          [ "$base" = main ] || { echo "the base is $base, not main"; exit 0; }
          [ "$head" = "$TESTED_SHA" ] || { echo 'the head moved since ci ran; the next run merges it'; exit 0; }
          gh pr merge "$PR" --repo "$REPO" --squash --delete-branch --match-head-commit "$TESTED_SHA"
          gh workflow run site.yml --repo "$REPO" --ref main

  build:
    name: deploy / build # no secrets: the full ci again, on the merged commit
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
      - run: bash .github/kit-identity.sh
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx --no playwright-core install --with-deps chromium
      - run: npx --no astro-kit ci
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-dist
          path: dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: deploy / production
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production # main only; CLOUDFLARE_API_TOKEN edits this one Worker
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-dist
          path: dist
      - name: The built mail binding equals wrangler.jsonc
        run: |
          [ -f dist/server/wrangler.json ] || { echo 'static site: wrangler.jsonc is the deploy config'; exit 0; }
          node -e '
            const fs = require("node:fs");
            const mail = (c) => JSON.stringify((c.send_email ?? []).map((m) => [m.name, m.destination_address ?? null, [...(m.allowed_destination_addresses ?? [])].sort()]).sort());
            const source = JSON.parse(fs.readFileSync("wrangler.jsonc", "utf8").replace(/^\s*\/\/.*$/gm, ""));
            const built = JSON.parse(fs.readFileSync("dist/server/wrangler.json", "utf8"));
            if (mail(source) !== mail(built)) { console.error(`::error::send_email differs: ${mail(built)} is not ${mail(source)}`); process.exit(1); }'
      - name: Upload the version and deploy it
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          config=wrangler.jsonc
          if [ -f dist/server/wrangler.json ]; then config=dist/server/wrangler.json; fi
          npx --yes "$WRANGLER" versions upload --config "$config" --message "main $SHA" | tee upload.log
          id=$(grep -oiE 'version id: *[0-9a-f-]{36}' upload.log | grep -oE '[0-9a-f-]{36}$' | head -n 1 || true)
          [ -n "$id" ] || { echo '::error::the upload printed no version id'; exit 1; }
          npx --yes "$WRANGLER" versions deploy "$id@100%" --config "$config" --message "main $SHA" -y

  preview:
    needs: ci
    if: >-
      github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'preview'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: preview # CLOUDFLARE_API_TOKEN for the <site>-preview Worker only
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          ref: ${{ github.base_ref }} # the base branch's wrangler.jsonc, never the pull request's
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: drafts-dist
          path: dist
      - name: Upload the preview version
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          npx --yes "$WRANGLER" versions upload --env preview --preview-alias "pr-$PR" --message "pr-$PR" | tee upload.log
          url=$(grep -oE "https://pr-$PR-[a-z0-9.-]+\.workers\.dev" upload.log | head -n 1 || true)
          [ -n "$url" ] || { echo '::error::the upload printed no preview URL'; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: The preview answers only through Cloudflare Access
        env:
          URL: ${{ steps.upload.outputs.url }}
        run: |
          set -euo pipefail
          if ! curl -sSI "$URL" | tr -d '\r' | grep -qiE '^location: https://[a-z0-9-]+\.cloudflareaccess\.com/'; then
            echo "::error::$URL answers without an Access login; protect the preview Worker with Cloudflare Access"; exit 1
          fi
          echo "Preview: $URL (behind Cloudflare Access)" >> "$GITHUB_STEP_SUMMARY"

  smoke:
    needs: deploy
    if: always() && (github.event_name == 'schedule' || needs.deploy.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
      - run: bash .github/kit-identity.sh
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Smoke production
        env:
          PROBE: ${{ github.event.schedule == '47 3 * * 1' && '--probe' || '' }}
          KIT_PROBE_SECRET: ${{ secrets.KIT_PROBE_SECRET }}
        run: npx --no astro-kit smoke "$(jq -r .site astro-kit.json)" $PROBE
      - name: 'Open or update the issue "smoke: production"'
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          n=$(gh issue list --repo "$REPO" --state open --search 'in:title "smoke: production"' --json number,title --jq 'map(select(.title == "smoke: production"))[0].number // empty')
          if [ -n "$n" ]; then gh issue comment "$n" --repo "$REPO" --body "Failed again: $RUN"
          else gh issue create --repo "$REPO" --title 'smoke: production' --body "Production smoke failed: $RUN"; fi

  feedback:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Is a feedback key set?
        id: key
        env:
          TOKEN: ${{ secrets.KIT_FEEDBACK_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then echo 'set=true' >> "$GITHUB_OUTPUT"; else echo 'No KIT_FEEDBACK_TOKEN: feedback stays in KIT-FEEDBACK.md.'; fi
      - if: steps.key.outputs.set == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - if: steps.key.outputs.set == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
      - if: steps.key.outputs.set == 'true'
        run: bash .github/kit-identity.sh
      - if: steps.key.outputs.set == 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund
      - if: steps.key.outputs.set == 'true'
        run: npx --no astro-kit feedback send
        env:
          KIT_FEEDBACK_TOKEN: ${{ secrets.KIT_FEEDBACK_TOKEN }}
          KIT_FEEDBACK_AUTO_KEY: ${{ secrets.KIT_FEEDBACK_AUTO_KEY }}
