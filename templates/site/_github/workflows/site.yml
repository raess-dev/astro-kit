# Managed by @raess/astro-kit. A protected file: the kit renders it, and only the protected task changes it.
# The site workflow (the kit's specification, 10.1). ci: the required check of each branch push. preview: one
# preview Worker version for each branch, behind Cloudflare Access. merge: squashes a green pull request of an agent
# account or Dependabot and dispatches the deploy. build, deploy, smoke and rollback: production from main.
# feedback: sends the entries of KIT-FEEDBACK.md. protected: the owner's task that renders the protected files (10.6).
# Every install step checks the lockfile with kit-identity.sh first and installs with an empty private npm cache.
# Project code runs only in ci and build, and neither holds a secret or a token that can write. Every job that holds
# a secret checks its checkout first, and wrangler reads no .env file and talks only to api.cloudflare.com.
name: site
on:
  push:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      protected:
        description: Render the protected files (the owner's task)
        type: boolean
        default: false
      branch:
        description: The branch that gets the protected files; empty for a pull request from main
        type: string
        default: ""
  schedule:
    - cron: "23 4 * * *"
    - cron: "47 3 * * 1"
permissions: {}
concurrency:
  group: site-${{ github.event_name == 'schedule' && 'schedule' || inputs.protected && 'protected' || 'run' }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref != 'refs/heads/main' }}
env:
  ASTRO_TELEMETRY_DISABLED: "1"
  SHA: ${{ github.sha }}
  REPO: ${{ github.repository }}
  RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
defaults:
  run:
    shell: bash
jobs:
  ci:
    name: site / ci
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      BASE_REF: main
    steps:
      # fetch-depth 0 brings origin/main, which kit-identity.sh compares the kit version with (10.3).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Check the lockfile
        run: bash .github/kit-identity.sh
      - name: Install with an empty private cache
        run: |
          c=$(mktemp -d)
          st=0
          npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org/ --replace-registry-host=never --strict-ssl=true --cache "$c" || st=$?
          rm -rf "$c"
          exit "$st"
      - name: Check the installed tree
        run: npm ls --all > /dev/null
      - name: Chromium for the browser checks
        run: npx --no playwright-core install --with-deps chromium
      - run: npx --no astro-kit ci
      - name: Rebuild for the preview on a forms site
        run: |
          set -euo pipefail
          forms=$(jq '.features.forms == true' astro-kit.json)
          if [ "$forms" = true ]; then CLOUDFLARE_ENV=preview npx --no astro-kit build; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preview-dist
          path: dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # The preview runs the wrangler.jsonc, the lockfile and the kit of main, never those of the branch, and checks the
  # built config of the branch before wrangler reads it.
  preview:
    name: site / preview
    needs: ci
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    environment:
      name: preview
      url: ${{ steps.upload.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Check the lockfile
        run: bash .github/kit-identity.sh
      - name: Install with an empty private cache
        run: |
          c=$(mktemp -d)
          st=0
          npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org/ --replace-registry-host=never --strict-ssl=true --cache "$c" || st=$?
          rm -rf "$c"
          exit "$st"
      - name: Check the installed tree
        run: npm ls --all > /dev/null
      - name: Check the checkout
        run: |
          set -euo pipefail
          s=$(git show origin/main:astro-kit.json)
          jq -e --argjson s "$s" '
            (["astro", "@raess/astro-kit", "wrangler"]
              + (if $s.features.forms == true then ["@astrojs/cloudflare"] else [] end)
              + (if $s.features.islands == true then ["@astrojs/solid-js", "solid-js", "eslint", "eslint-plugin-solid", "typescript-eslint"] else [] end)
              + ($s.dependencies // [])) as $ok
            | [.dependencies, .devDependencies, .optionalDependencies, .peerDependencies | (. // {}) | keys[]]
            | all(. as $n | $ok | index($n) != null)' package.json >/dev/null 2>&1 ||
            { echo '::error::package.json has a direct dependency that is not on the allowlist of the kit'; exit 1; }
          found=$(find . \( -path ./.git -o -path ./node_modules \) -prune -o \( -name '.env*' -o -name '.dev.vars*' -o -name .wrangler \) -print)
          [ -z "$found" ] || { echo '::error::the checkout holds a .env, .dev.vars or .wrangler file, which wrangler would read'; exit 1; }
          for bin in wrangler:wrangler/bin/wrangler.js astro-kit:@raess/astro-kit/dist/cli.js; do
            [ "$(readlink -f "node_modules/.bin/${bin%%:*}")" = "$(readlink -f "node_modules/${bin#*:}")" ] ||
              { echo "::error::node_modules/.bin/${bin%%:*} is not the bin of its own package"; exit 1; }
          done
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: preview-dist
          path: dist
      - name: Check the built preview config
        env:
          CHECK: |
            def blank: . == null or . == [] or (type == "object" and all(.[]; blank));
            . as $b
            | ($w + if $target == "preview" then $w.env.preview + {send_email: [], ratelimits: []} else {} end) as $w
            | {name: $w.name, compatibility_date: $w.compatibility_date, compatibility_flags: ($w.compatibility_flags // []),
               routes: $w.routes, workers_dev: $w.workers_dev, preview_urls: $w.preview_urls, observability: $w.observability,
               send_email: ($w.send_email // []), ratelimits: ($w.ratelimits // []), main: "entry.mjs", no_bundle: true,
               rules: [{type: "ESModule", globs: ["**/*.js", "**/*.mjs"]}],
               assets: ($w.assets + {directory: "../client", binding: "ASSETS"})} as $kit
            | ["configPath", "userConfigPath", "topLevelName", "definedEnvironments", "targetEnvironment", "jsx_factory",
               "jsx_fragment", "upload_source_maps", "python_modules", "dev"] as $free
            | ["agent_memory", "ai_search", "ai_search_namespaces", "analytics_engine_datasets", "artifacts", "cloudchamber",
               "connect", "d1_databases", "dispatch_namespaces", "durable_objects", "exports", "flagship", "hyperdrive", "k2",
               "kv_namespaces", "logfwdr", "migrations", "mtls_certificates", "pipelines", "previews", "queues", "r2_buckets",
               "secrets_store_secrets", "services", "triggers", "unsafe_hello_world", "vars", "vectorize", "vpc_networks",
               "vpc_services", "worker_loaders", "workflows"] as $bindings
            | if type != "object" then "is not a JSON object"
              elif has("build") then "holds a build command"
              elif (keys - ($kit | keys) - $free - $bindings) != [] then "holds a key that the kit does not know"
              else [$bindings[] | select($b[.] | blank | not)] as $named
                | [$kit | keys[] | select($kit[.] != $b[.])] as $differ
                | if $named != [] then "holds a binding that wrangler.jsonc does not name: \($named | join(", "))"
                  elif $differ != [] then "differs from wrangler.jsonc in \($differ | join(", "))"
                  else empty end
              end
        run: |
          set -euo pipefail
          built=dist/server/wrangler.json
          if [ -e "$built" ]; then
            want=$(sed -E '/^[[:space:]]*\/\/.*$/d' wrangler.jsonc | jq -c .)
            problem=$(jq -r --argjson w "$want" --arg target preview "$CHECK" "$built" 2>/dev/null) || problem='is not a JSON object'
            [ -z "$problem" ] || { echo "::error::the built Worker config $problem"; exit 1; }
          fi
      - name: The alias of the branch
        id: alias
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ALIAS="b-$(printf '%s' "$BRANCH" | sha256sum | cut -c1-10)"
          echo "alias=$ALIAS" >> "$GITHUB_OUTPUT"
      - name: Upload the preview version
        id: upload
        env:
          BRANCH: ${{ github.ref_name }}
          ALIAS: ${{ steps.alias.outputs.alias }}
          CLOUDFLARE_API_BASE_URL: https://api.cloudflare.com/client/v4
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/empty.env"
          if [ -e dist/server/wrangler.json ]; then
            npx --no wrangler versions upload --config dist/server/wrangler.json --preview-alias "$ALIAS" --message "$BRANCH $SHA" --env-file "$RUNNER_TEMP/empty.env" | tee upload.log
          else
            npx --no wrangler versions upload --config wrangler.jsonc --env preview --preview-alias "$ALIAS" --message "$BRANCH $SHA" --env-file "$RUNNER_TEMP/empty.env" | tee upload.log
          fi
          url=$(grep -oE "https://$ALIAS-[a-z0-9.-]+\.workers\.dev" upload.log | head -n 1) || url=
          [ -n "$url" ] || { echo '::error::the upload printed no preview URL'; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: The preview is behind Cloudflare Access
        env:
          URL: ${{ steps.upload.outputs.url }}
        run: |
          set -euo pipefail
          headers=$(curl -sSI "$URL") || headers=
          grep -qiE '^location: https://[a-z0-9-]+\.cloudflareaccess\.com/' <<<"$headers" ||
            { echo "::error::$URL answers without an Access login; protect the preview Worker with Cloudflare Access"; exit 1; }
      - name: Summary
        env:
          BRANCH: ${{ github.ref_name }}
          URL: ${{ steps.upload.outputs.url }}
        run: |
          echo "Preview of $BRANCH: $URL (behind Cloudflare Access)" >> "$GITHUB_STEP_SUMMARY"

  merge:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Merge the tested head
        env:
          GH_TOKEN: ${{ github.token }}
          KIT_AGENTS: ${{ vars.KIT_AGENTS }}
          BRANCH: ${{ github.ref_name }}
          TESTED_SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          if [ -z "${PR:-}" ]; then
            PR=$(gh api "repos/$REPO/pulls?state=open&head=${REPO%%/*}:$BRANCH" --jq '.[0].number // empty')
            [ -n "$PR" ] || { echo 'this branch has no open pull request yet'; exit 0; }
          fi
          live=$(gh api "repos/$REPO/pulls/$PR" --jq '[.state, .draft, .head.sha, .base.ref, .user.login] | @tsv')
          IFS=$'\t' read -r state draft head base author <<<"$live"
          [ "$state" = open ] || { echo "the pull request is $state"; exit 0; }
          [ "$draft" = false ] || { echo 'a draft waits for the owner'; exit 0; }
          [ "$base" = main ] || { echo "the base is $base, not main"; exit 0; }
          [ "$head" = "$TESTED_SHA" ] || { echo 'the head moved since this run started; the run of the new head merges it'; exit 0; }
          jq -e --arg a "$author" '(. + ["dependabot[bot]"]) | index($a) != null' <<<"${KIT_AGENTS:-[]}" >/dev/null ||
            { echo "$author is not an agent account: CI does not merge this pull request"; exit 0; }
          agents=$(jq -c --arg a "$author" 'if $a == "dependabot[bot]" then . + [$a] else . end' <<<"${KIT_AGENTS:-[]}")
          only() { jq -e -n -R --argjson ok "$agents" '[inputs] | length > 0 and all(. as $x | $ok | index($x) != null)' >/dev/null; }
          pushers=${ACTOR:-$(gh api "repos/$REPO/actions/workflows/site.yml/runs?event=push&head_sha=$TESTED_SHA" --jq '.workflow_runs[].actor.login')}
          only <<<"$pushers" || { echo 'the tested head was not pushed by an agent account: CI does not merge this pull request'; exit 0; }
          authors=$(gh api --paginate "repos/$REPO/pulls/$PR/commits" --jq '.[] | .author.login // "-"')
          only <<<"$authors" || { echo 'a commit has an author that is not an agent account: CI does not merge this pull request'; exit 0; }
          files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[] | .filename, (.previous_filename // empty)')
          if grep -qE '^\.github/|^\.npmrc$|(^|/)wrangler\.[^/]+$|(^|/)(\.env|\.dev\.vars)[^/]*$|(^|/)\.wrangler/' <<<"$files"; then
            echo 'it changes a protected file: the owner approves it and merges it by hand'; exit 0
          fi
          if ! out=$(gh pr merge "$PR" --repo "$REPO" --squash --delete-branch --match-head-commit "$TESTED_SHA" 2>&1); then
            echo "GitHub refused the merge: $out"
            echo 'A required check is not green yet, or an owner file waits for the approval of the owner.'
            exit 0
          fi
          gh workflow run site.yml --repo "$REPO" --ref main

  # Project code runs in this job, so it holds no token that can write.
  build:
    name: deploy / build
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.protected))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      BASE_REF: main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Check the lockfile
        run: bash .github/kit-identity.sh
      - name: Install with an empty private cache
        run: |
          c=$(mktemp -d)
          st=0
          npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org/ --replace-registry-host=never --strict-ssl=true --cache "$c" || st=$?
          rm -rf "$c"
          exit "$st"
      - name: Check the installed tree
        run: npm ls --all > /dev/null
      - name: Chromium for the browser checks
        run: npx --no playwright-core install --with-deps chromium
      - run: npx --no astro-kit ci
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-dist
          path: dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  build-alert:
    needs: build
    if: always() && needs.build.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Alert
        if: needs.build.result == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "main: build failed"
          BODY: "Failed:"
          KIT_OWNER: ${{ vars.KIT_OWNER }}
        run: |
          set -euo pipefail
          n=$(gh api --paginate "repos/$REPO/issues?state=open&per_page=100" --jq ".[] | select(.pull_request == null and .user.login == \"github-actions[bot]\" and .title == \"$TITLE\") | .number" | sort -n | tail -n 1)
          if [ -n "$n" ]; then gh issue comment "$n" --repo "$REPO" --body "Failed again: $RUN"
          else gh issue create --repo "$REPO" --title "$TITLE" --assignee "$KIT_OWNER" --body "$BODY $RUN"; fi
      - name: Close
        if: needs.build.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "main: build failed"
          COMMENT: Fixed by ${{ github.sha }}
        run: |
          set -euo pipefail
          n=$(gh api --paginate "repos/$REPO/issues?state=open&per_page=100" --jq ".[] | select(.pull_request == null and .user.login == \"github-actions[bot]\" and .title == \"$TITLE\") | .number" | sort -n | tail -n 1)
          [ -z "$n" ] || gh issue close "$n" --repo "$REPO" --comment "$COMMENT"

  # The deploy runs the kit and wrangler only: the Worker config is checked before wrangler reads it.
  deploy:
    name: deploy / production
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    outputs:
      deployed: ${{ steps.gate.outputs.deployed || steps.deploy.outputs.deployed || 'false' }}
      live: ${{ steps.live.outputs.id }}
    steps:
      - name: Rollback gate
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          KIT_OWNER: ${{ vars.KIT_OWNER }}
        run: |
          set -euo pipefail
          main=$(gh api "repos/$REPO/git/ref/heads/main" --jq .object.sha)
          [ "$main" = "$SHA" ] || { echo '::error::main has moved on since this run started: only the run of its head deploys'; exit 1; }
          hold() {
            held=
            for title in 'rollback: production' 'rollback failed: production'; do
              n=$(gh api --paginate "repos/$REPO/issues?state=all&per_page=100" --jq ".[] | select(.pull_request == null and .user.login == \"github-actions[bot]\" and .title == \"$title\") | .number" | sort -n | tail -n 1)
              [ -n "$n" ] || continue
              s=$(gh api "repos/$REPO/issues/$n" --jq "if .state == \"open\" then \"open\" elif .closed_by.login == \"$KIT_OWNER\" then \"\" else \"closed\" end")
              [ -z "$s" ] || held+="$n $s"$'\n'
            done
          }
          hold
          if [ -n "$held" ]; then
            sleep 30
            hold
          fi
          if [ -n "$held" ]; then
            while read -r n s; do
              [ "$s" != closed ] || gh issue reopen "$n" --repo "$REPO" --comment "Reopened by $RUN: only the owner lifts the hold, by closing this issue."
            done <<<"${held%$'\n'}"
            echo 'production is rolled back: nothing deploys until the owner closes the issue "rollback: production" or "rollback failed: production"'
            echo 'deployed=false' >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.deployed != 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - if: steps.gate.outputs.deployed != 'false'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Check the lockfile
        if: steps.gate.outputs.deployed != 'false'
        run: bash .github/kit-identity.sh
      - name: Install with an empty private cache
        if: steps.gate.outputs.deployed != 'false'
        run: |
          c=$(mktemp -d)
          st=0
          npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org/ --replace-registry-host=never --strict-ssl=true --cache "$c" || st=$?
          rm -rf "$c"
          exit "$st"
      - name: Check the installed tree
        if: steps.gate.outputs.deployed != 'false'
        run: npm ls --all > /dev/null
      - name: Check the checkout
        if: steps.gate.outputs.deployed != 'false'
        run: |
          set -euo pipefail
          s=$(git show origin/main:astro-kit.json)
          jq -e --argjson s "$s" '
            (["astro", "@raess/astro-kit", "wrangler"]
              + (if $s.features.forms == true then ["@astrojs/cloudflare"] else [] end)
              + (if $s.features.islands == true then ["@astrojs/solid-js", "solid-js", "eslint", "eslint-plugin-solid", "typescript-eslint"] else [] end)
              + ($s.dependencies // [])) as $ok
            | [.dependencies, .devDependencies, .optionalDependencies, .peerDependencies | (. // {}) | keys[]]
            | all(. as $n | $ok | index($n) != null)' package.json >/dev/null 2>&1 ||
            { echo '::error::package.json has a direct dependency that is not on the allowlist of the kit'; exit 1; }
          found=$(find . \( -path ./.git -o -path ./node_modules \) -prune -o \( -name '.env*' -o -name '.dev.vars*' -o -name .wrangler \) -print)
          [ -z "$found" ] || { echo '::error::the checkout holds a .env, .dev.vars or .wrangler file, which wrangler would read'; exit 1; }
          for bin in wrangler:wrangler/bin/wrangler.js astro-kit:@raess/astro-kit/dist/cli.js; do
            [ "$(readlink -f "node_modules/.bin/${bin%%:*}")" = "$(readlink -f "node_modules/${bin#*:}")" ] ||
              { echo "::error::node_modules/.bin/${bin%%:*} is not the bin of its own package"; exit 1; }
          done
      - if: steps.gate.outputs.deployed != 'false'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-dist
          path: dist
      - name: Config check
        id: config
        if: steps.gate.outputs.deployed != 'false'
        env:
          CHECK: |
            def blank: . == null or . == [] or (type == "object" and all(.[]; blank));
            . as $b
            | ($w + if $target == "preview" then $w.env.preview + {send_email: [], ratelimits: []} else {} end) as $w
            | {name: $w.name, compatibility_date: $w.compatibility_date, compatibility_flags: ($w.compatibility_flags // []),
               routes: $w.routes, workers_dev: $w.workers_dev, preview_urls: $w.preview_urls, observability: $w.observability,
               send_email: ($w.send_email // []), ratelimits: ($w.ratelimits // []), main: "entry.mjs", no_bundle: true,
               rules: [{type: "ESModule", globs: ["**/*.js", "**/*.mjs"]}],
               assets: ($w.assets + {directory: "../client", binding: "ASSETS"})} as $kit
            | ["configPath", "userConfigPath", "topLevelName", "definedEnvironments", "targetEnvironment", "jsx_factory",
               "jsx_fragment", "upload_source_maps", "python_modules", "dev"] as $free
            | ["agent_memory", "ai_search", "ai_search_namespaces", "analytics_engine_datasets", "artifacts", "cloudchamber",
               "connect", "d1_databases", "dispatch_namespaces", "durable_objects", "exports", "flagship", "hyperdrive", "k2",
               "kv_namespaces", "logfwdr", "migrations", "mtls_certificates", "pipelines", "previews", "queues", "r2_buckets",
               "secrets_store_secrets", "services", "triggers", "unsafe_hello_world", "vars", "vectorize", "vpc_networks",
               "vpc_services", "worker_loaders", "workflows"] as $bindings
            | if type != "object" then "is not a JSON object"
              elif has("build") then "holds a build command"
              elif (keys - ($kit | keys) - $free - $bindings) != [] then "holds a key that the kit does not know"
              else [$bindings[] | select($b[.] | blank | not)] as $named
                | [$kit | keys[] | select($kit[.] != $b[.])] as $differ
                | if $named != [] then "holds a binding that wrangler.jsonc does not name: \($named | join(", "))"
                  elif $differ != [] then "differs from wrangler.jsonc in \($differ | join(", "))"
                  else empty end
              end
        run: |
          set -euo pipefail
          built=dist/server/wrangler.json
          forms=$(jq '.features.forms == true' astro-kit.json)
          if [ "$forms" != true ]; then
            [ ! -e "$built" ] || { echo '::error::a static site built a Worker config'; exit 1; }
            echo 'config=wrangler.jsonc' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [ -f "$built" ] || { echo '::error::a forms site built no Worker config'; exit 1; }
          want=$(sed -E '/^[[:space:]]*\/\/.*$/d' wrangler.jsonc | jq -c .)
          problem=$(jq -r --argjson w "$want" --arg target production "$CHECK" "$built" 2>/dev/null) || problem='is not a JSON object'
          [ -z "$problem" ] || { echo "::error::the built Worker config $problem"; exit 1; }
          echo "config=$built" >> "$GITHUB_OUTPUT"
      - name: The live version
        id: live
        if: steps.gate.outputs.deployed != 'false'
        env:
          CLOUDFLARE_API_BASE_URL: https://api.cloudflare.com/client/v4
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/empty.env"
          WORKER=$(sed -E '/^[[:space:]]*\/\/.*$/d' wrangler.jsonc | jq -er '.name')
          if out=$(npx --no wrangler deployments status --name "$WORKER" --json --env-file "$RUNNER_TEMP/empty.env"); then
            id=$(jq -er '.versions | select(length == 1 and .[0].percentage == 100) | .[0].version_id | select(test("^[0-9a-f-]{36}$"))' <<<"$out") ||
              { echo '::error::production does not run one version at 100%: the owner settles it in the Cloudflare dashboard'; exit 1; }
            echo "id=$id" >> "$GITHUB_OUTPUT"
          else
            echo 'No live version: a smoke failure after this deploy has nothing to roll back to.'
          fi
      - name: Upload the version
        id: upload
        if: steps.gate.outputs.deployed != 'false'
        env:
          CONFIG: ${{ steps.config.outputs.config }}
          CLOUDFLARE_API_BASE_URL: https://api.cloudflare.com/client/v4
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/empty.env"
          npx --no wrangler versions upload --config "$CONFIG" --message "main $SHA" --env-file "$RUNNER_TEMP/empty.env" | tee upload.log
          id=$(grep -oiE 'version id: *[0-9a-f-]{36}' upload.log | head -n 1 | grep -oiE '[0-9a-f-]{36}$') || id=
          [ -n "$id" ] || { echo '::error::the upload printed no version id'; exit 1; }
          echo "id=$id" >> "$GITHUB_OUTPUT"
      - name: Deploy the version
        id: deploy
        if: steps.gate.outputs.deployed != 'false'
        env:
          CONFIG: ${{ steps.config.outputs.config }}
          ID: ${{ steps.upload.outputs.id }}
          CLOUDFLARE_API_BASE_URL: https://api.cloudflare.com/client/v4
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/empty.env"
          npx --no wrangler versions deploy "$ID@100%" --config "$CONFIG" --message "main $SHA" -y --env-file "$RUNNER_TEMP/empty.env"
          echo 'deployed=true' >> "$GITHUB_OUTPUT"

  smoke:
    needs: deploy
    if: always() && (github.event_name == 'schedule' || (needs.deploy.result == 'success' && needs.deploy.outputs.deployed == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    concurrency:
      group: ${{ github.event_name == 'schedule' && 'smoke-schedule' || 'deploy-production' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Check the lockfile
        run: bash .github/kit-identity.sh
      - name: Install with an empty private cache
        run: |
          c=$(mktemp -d)
          st=0
          npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org/ --replace-registry-host=never --strict-ssl=true --cache "$c" || st=$?
          rm -rf "$c"
          exit "$st"
      - name: Check the installed tree
        run: npm ls --all > /dev/null
      - name: Check the checkout
        run: |
          set -euo pipefail
          s=$(git show origin/main:astro-kit.json)
          jq -e --argjson s "$s" '
            (["astro", "@raess/astro-kit", "wrangler"]
              + (if $s.features.forms == true then ["@astrojs/cloudflare"] else [] end)
              + (if $s.features.islands == true then ["@astrojs/solid-js", "solid-js", "eslint", "eslint-plugin-solid", "typescript-eslint"] else [] end)
              + ($s.dependencies // [])) as $ok
            | [.dependencies, .devDependencies, .optionalDependencies, .peerDependencies | (. // {}) | keys[]]
            | all(. as $n | $ok | index($n) != null)' package.json >/dev/null 2>&1 ||
            { echo '::error::package.json has a direct dependency that is not on the allowlist of the kit'; exit 1; }
          found=$(find . \( -path ./.git -o -path ./node_modules \) -prune -o \( -name '.env*' -o -name '.dev.vars*' -o -name .wrangler \) -print)
          [ -z "$found" ] || { echo '::error::the checkout holds a .env, .dev.vars or .wrangler file, which wrangler would read'; exit 1; }
          for bin in wrangler:wrangler/bin/wrangler.js astro-kit:@raess/astro-kit/dist/cli.js; do
            [ "$(readlink -f "node_modules/.bin/${bin%%:*}")" = "$(readlink -f "node_modules/${bin#*:}")" ] ||
              { echo "::error::node_modules/.bin/${bin%%:*} is not the bin of its own package"; exit 1; }
          done
      - name: Smoke
        env:
          PROBE: ${{ github.event.schedule == '47 3 * * 1' && '--probe' || '' }}
          KIT_PROBE_SECRET: ${{ secrets.KIT_PROBE_SECRET }}
          KIT_WORKERS_DEV: ${{ vars.KIT_WORKERS_DEV }}
          KIT_RELEASE_SHA: ${{ github.event_name != 'schedule' && github.sha || '' }}
        run: npx --no astro-kit smoke "$(jq -r .site astro-kit.json)" $PROBE
      - name: Alert
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "smoke: production"
          BODY: "Failed:"
          KIT_OWNER: ${{ vars.KIT_OWNER }}
        run: |
          set -euo pipefail
          n=$(gh api --paginate "repos/$REPO/issues?state=open&per_page=100" --jq ".[] | select(.pull_request == null and .user.login == \"github-actions[bot]\" and .title == \"$TITLE\") | .number" | sort -n | tail -n 1)
          if [ -n "$n" ]; then gh issue comment "$n" --repo "$REPO" --body "Failed again: $RUN"
          else gh issue create --repo "$REPO" --title "$TITLE" --assignee "$KIT_OWNER" --body "$BODY $RUN"; fi
      - name: Close
        if: success() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "smoke: production"
          COMMENT: "Passed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          set -euo pipefail
          n=$(gh api --paginate "repos/$REPO/issues?state=open&per_page=100" --jq ".[] | select(.pull_request == null and .user.login == \"github-actions[bot]\" and .title == \"$TITLE\") | .number" | sort -n | tail -n 1)
          [ -z "$n" ] || gh issue close "$n" --repo "$REPO" --comment "$COMMENT"

  rollback:
    name: deploy / rollback
    needs: [deploy, smoke]
    if: always() && needs.deploy.outputs.deployed == 'true' && needs.smoke.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Check the lockfile
        run: bash .github/kit-identity.sh
      - name: Install with an empty private cache
        run: |
          c=$(mktemp -d)
          st=0
          npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org/ --replace-registry-host=never --strict-ssl=true --cache "$c" || st=$?
          rm -rf "$c"
          exit "$st"
      - name: Check the installed tree
        run: npm ls --all > /dev/null
      - name: Check the checkout
        run: |
          set -euo pipefail
          s=$(git show origin/main:astro-kit.json)
          jq -e --argjson s "$s" '
            (["astro", "@raess/astro-kit", "wrangler"]
              + (if $s.features.forms == true then ["@astrojs/cloudflare"] else [] end)
              + (if $s.features.islands == true then ["@astrojs/solid-js", "solid-js", "eslint", "eslint-plugin-solid", "typescript-eslint"] else [] end)
              + ($s.dependencies // [])) as $ok
            | [.dependencies, .devDependencies, .optionalDependencies, .peerDependencies | (. // {}) | keys[]]
            | all(. as $n | $ok | index($n) != null)' package.json >/dev/null 2>&1 ||
            { echo '::error::package.json has a direct dependency that is not on the allowlist of the kit'; exit 1; }
          found=$(find . \( -path ./.git -o -path ./node_modules \) -prune -o \( -name '.env*' -o -name '.dev.vars*' -o -name .wrangler \) -print)
          [ -z "$found" ] || { echo '::error::the checkout holds a .env, .dev.vars or .wrangler file, which wrangler would read'; exit 1; }
          for bin in wrangler:wrangler/bin/wrangler.js astro-kit:@raess/astro-kit/dist/cli.js; do
            [ "$(readlink -f "node_modules/.bin/${bin%%:*}")" = "$(readlink -f "node_modules/${bin#*:}")" ] ||
              { echo "::error::node_modules/.bin/${bin%%:*} is not the bin of its own package"; exit 1; }
          done
      - name: Roll production back
        env:
          LIVE: ${{ needs.deploy.outputs.live }}
          CLOUDFLARE_API_BASE_URL: https://api.cloudflare.com/client/v4
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          [[ "$LIVE" =~ ^[0-9a-f-]{36}$ ]] || { echo '::error::the deploy recorded no live version: there is nothing to roll back to'; exit 1; }
          WORKER=$(sed -E '/^[[:space:]]*\/\/.*$/d' wrangler.jsonc | jq -er '.name')
          : > "$RUNNER_TEMP/empty.env"
          npx --no wrangler rollback "$LIVE" --name "$WORKER" --message "smoke failed: $RUN" -y --env-file "$RUNNER_TEMP/empty.env"
      - name: Alert
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "rollback: production"
          BODY: Smoke failed after the deploy of ${{ github.sha }}. Production runs the version before it again.
          KIT_OWNER: ${{ vars.KIT_OWNER }}
        run: |
          set -euo pipefail
          n=$(gh api --paginate "repos/$REPO/issues?state=open&per_page=100" --jq ".[] | select(.pull_request == null and .user.login == \"github-actions[bot]\" and .title == \"$TITLE\") | .number" | sort -n | tail -n 1)
          if [ -n "$n" ]; then gh issue comment "$n" --repo "$REPO" --body "Failed again: $RUN"
          else gh issue create --repo "$REPO" --title "$TITLE" --assignee "$KIT_OWNER" --body "$BODY $RUN"; fi
      - name: Alert the failed rollback
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "rollback failed: production"
          BODY: Smoke failed after the deploy of ${{ github.sha }}, and the rollback failed too. Production may run that version.
          KIT_OWNER: ${{ vars.KIT_OWNER }}
        run: |
          set -euo pipefail
          n=$(gh api --paginate "repos/$REPO/issues?state=open&per_page=100" --jq ".[] | select(.pull_request == null and .user.login == \"github-actions[bot]\" and .title == \"$TITLE\") | .number" | sort -n | tail -n 1)
          if [ -n "$n" ]; then gh issue comment "$n" --repo "$REPO" --body "Failed again: $RUN"
          else gh issue create --repo "$REPO" --title "$TITLE" --assignee "$KIT_OWNER" --body "$BODY $RUN"; fi

  feedback:
    needs: ci
    if: github.event_name == 'push' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: The feedback token
        id: token
        env:
          HAS_TOKEN: ${{ secrets.KIT_FEEDBACK_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" = true ]; then echo 'send=true' >> "$GITHUB_OUTPUT"
          else echo 'No KIT_FEEDBACK_TOKEN: feedback stays in KIT-FEEDBACK.md.'; fi
      - if: steps.token.outputs.send == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - if: steps.token.outputs.send == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Check the lockfile
        if: steps.token.outputs.send == 'true'
        run: bash .github/kit-identity.sh
      - name: Install with an empty private cache
        if: steps.token.outputs.send == 'true'
        run: |
          c=$(mktemp -d)
          st=0
          npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org/ --replace-registry-host=never --strict-ssl=true --cache "$c" || st=$?
          rm -rf "$c"
          exit "$st"
      - name: Check the installed tree
        if: steps.token.outputs.send == 'true'
        run: npm ls --all > /dev/null
      - name: Check the checkout
        if: steps.token.outputs.send == 'true'
        run: |
          set -euo pipefail
          s=$(git show origin/main:astro-kit.json)
          jq -e --argjson s "$s" '
            (["astro", "@raess/astro-kit", "wrangler"]
              + (if $s.features.forms == true then ["@astrojs/cloudflare"] else [] end)
              + (if $s.features.islands == true then ["@astrojs/solid-js", "solid-js", "eslint", "eslint-plugin-solid", "typescript-eslint"] else [] end)
              + ($s.dependencies // [])) as $ok
            | [.dependencies, .devDependencies, .optionalDependencies, .peerDependencies | (. // {}) | keys[]]
            | all(. as $n | $ok | index($n) != null)' package.json >/dev/null 2>&1 ||
            { echo '::error::package.json has a direct dependency that is not on the allowlist of the kit'; exit 1; }
          found=$(find . \( -path ./.git -o -path ./node_modules \) -prune -o \( -name '.env*' -o -name '.dev.vars*' -o -name .wrangler \) -print)
          [ -z "$found" ] || { echo '::error::the checkout holds a .env, .dev.vars or .wrangler file, which wrangler would read'; exit 1; }
          for bin in wrangler:wrangler/bin/wrangler.js astro-kit:@raess/astro-kit/dist/cli.js; do
            [ "$(readlink -f "node_modules/.bin/${bin%%:*}")" = "$(readlink -f "node_modules/${bin#*:}")" ] ||
              { echo "::error::node_modules/.bin/${bin%%:*} is not the bin of its own package"; exit 1; }
          done
      - name: Send the feedback
        if: steps.token.outputs.send == 'true'
        env:
          KIT_FEEDBACK_TOKEN: ${{ secrets.KIT_FEEDBACK_TOKEN }}
          KIT_FEEDBACK_AUTO_KEY: ${{ secrets.KIT_FEEDBACK_AUTO_KEY }}
        run: npx --no astro-kit feedback send

  # The owner's task (10.6): it renders the protected files with the kit of the lockfile and pushes them with the
  # deploy key, which passes the push ruleset. No project code runs here: npm installs only the kit, outside the
  # checkout, and init reads astro-kit.json as data.
  protected:
    name: site / protected
    if: >-
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
      inputs.protected && github.actor == vars.KIT_OWNER
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    environment: owner
    env:
      BRANCH: ${{ inputs.branch }}
    steps:
      - name: Check the branch input
        run: |
          [[ "$BRANCH" =~ ^[A-Za-z0-9._/-]*$ ]] ||
            { echo '::error::the branch input holds a character outside A-Z, a-z, 0-9 and . _ / -'; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.branch || 'main' }}
          ssh-key: ${{ secrets.KIT_PROTECTED_KEY }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Check the lockfile
        run: bash .github/kit-identity.sh
      - name: Install only the kit, outside the checkout
        run: |
          set -euo pipefail
          version=$(jq -r '.packages["node_modules/@raess/astro-kit"].version' package-lock.json)
          c=$(mktemp -d)
          st=0
          npm install --prefix "$RUNNER_TEMP/kit" --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org/ --replace-registry-host=never --strict-ssl=true --cache "$c" --save-exact "@raess/astro-kit@$version" || st=$?
          rm -rf "$c"
          exit "$st"
      - name: Render the protected files
        run: node "$RUNNER_TEMP/kit/node_modules/@raess/astro-kit/dist/cli.js" init --protected
      - name: Push the protected files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo 'The protected files are up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: render the protected files'
          if [ -n "$BRANCH" ]; then
            git push origin "HEAD:$BRANCH"
          else
            git push --force origin HEAD:refs/heads/kit/protected
            if [ "$(gh pr list --repo "$REPO" --head kit/protected --state open --json number --jq length)" = 0 ]; then
              gh pr create --repo "$REPO" --base main --head kit/protected --title 'Render the protected files' --body 'Rendered by the protected task.'
            fi
          fi
