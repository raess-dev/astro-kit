# Stages the version in package.json on npm through trusted publishing, only when npm does not have it yet.
# Staging never publishes: the owner approves each version with 2FA after `npm diff` (see README.md).
# The trusted publisher is raess-dev/astro-kit with this file, allowed to stage only.
name: release
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  stage:
    name: release / stage
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # the npm OIDC exchange
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false # no cache in a publishing job
      - name: npm 11.15 or later, for staged publishing
        run: | # zizmor: ignore[adhoc-packages] an exact npm pin, installed only when the bundled npm is older
          set -euo pipefail
          if ! node -e 'const [a, b] = process.argv[1].split(".").map(Number); process.exit(a > 11 || (a === 11 && b >= 15) ? 0 : 1)' "$(npm --version)"; then
            npm install -g npm@11.21.2 --ignore-scripts --no-audit --no-fund
          fi
          npm --version
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npm test
      - name: Stage the version unless npm has it
        run: |
          set -euo pipefail
          name=$(node -p 'require("./package.json").name')
          version=$(node -p 'require("./package.json").version')
          if [ -n "$(npm view "$name@$version" version 2>/dev/null || true)" ]; then
            echo "$name@$version is on npm already; nothing to stage."; exit 0
          fi
          if ! npm stage publish 2>&1 | tee stage.log; then
            grep -qiE 'already (exists|staged)|E409' stage.log || exit 1
            echo "$name@$version is staged already and waits for approval."; exit 0
          fi
          echo "Staged $name@$version. Approve it with 2FA: npm stage list $name, then npm stage approve <id>." >> "$GITHUB_STEP_SUMMARY"
